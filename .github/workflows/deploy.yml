name: Deploy

# Build on GitHub, ship the finished image to the server over SSH.
#
# Why not `docker compose pull` on the server (what this workflow used to do)?
# ghcr.io is heavily filtered from that host -- measured 1 of 5 TLS handshakes
# completing. Pulling a multi-layer image needs many consecutive successful
# connections, so registry pulls there either stall or fail outright.
# `.bash_history` on the box is full of the retry loops and DNS probes from
# working around exactly this.
#
# Why not build on the server? It has 3.8 GB of RAM with two other apps
# already resident. `next build` peaks well past the headroom, and an OOM
# during a build would take the neighbours down with it.
#
# So: build in Actions (fast, unfiltered, no load on the box), `docker save`
# the result, stream it over SSH, `docker load` on the far end. Outbound SSH to
# the server is reliable, unlike ghcr.io.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave on one server. `cancel-in-progress: false`
# because a half-finished deploy is worse than a queued one -- letting a
# migration get cancelled mid-run is how you get a schema nothing matches.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # No domain yet, so the public URL is the bare IP. This is baked into the
  # image at build time (NEXT_PUBLIC_*, see infra/Dockerfile) -- when the real
  # domain lands, change it here and redeploy; an .env edit is not enough.
  SITE_URL: http://194.180.11.200
  DEPLOY_DIR: /opt/pishnam

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The migrator image is node_modules-sized and changes far less often
      # than the app. Hashing its real inputs lets us skip rebuilding and
      # (more importantly) re-transferring it on the vast majority of deploys.
      - name: Compute image tags
        id: tags
        run: |
          echo "web=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          migrator_hash=$(cat package-lock.json infra/Dockerfile prisma/schema.prisma prisma/seed.ts $(find prisma/migrations -type f | sort) | sha256sum | cut -c1-16)
          echo "migrator=${migrator_hash}" >> "$GITHUB_OUTPUT"
          echo "Migrator inputs hash: ${migrator_hash}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          ssh target 'echo "SSH OK on $(hostname)"'

      # --- web image ------------------------------------------------------
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: runner
          load: true
          tags: pishnam-web:${{ steps.tags.outputs.web }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ vars.UMAMI_SCRIPT_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # --- migrator image (only when its inputs changed) ------------------
      - name: Check whether migrator image is already on the server
        id: migrator_check
        run: |
          if ssh target "docker image inspect pishnam-migrator:${{ steps.tags.outputs.migrator }} >/dev/null 2>&1"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Migrator image already present on server, skipping build and transfer."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Migrator image missing on server, will build and ship."
          fi

      - name: Build migrator image
        if: steps.migrator_check.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: migrator
          load: true
          tags: pishnam-migrator:${{ steps.tags.outputs.migrator }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

      # --- transfer -------------------------------------------------------
      # `docker load` detects the gzip stream itself. Retried because the link
      # to this host is not dependable and a dropped transfer is cheap to
      # repeat -- `docker load` is idempotent.
      - name: Ship images to server
        run: |
          ship() {
            local image="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "::group::Transfer ${image} (attempt ${attempt})"
              if docker save "$image" | gzip -1 | ssh target 'docker load'; then
                echo "::endgroup::"
                echo "Transferred ${image}"
                return 0
              fi
              echo "::endgroup::"
              echo "Attempt ${attempt} for ${image} failed."
              sleep 15
            done
            echo "Giving up on ${image} after 3 attempts."
            return 1
          }

          ship "pishnam-web:${{ steps.tags.outputs.web }}"
          if [ "${{ steps.migrator_check.outputs.needed }}" = "true" ]; then
            ship "pishnam-migrator:${{ steps.tags.outputs.migrator }}"
          fi

      # Compose and the container nginx config are the only repo files the
      # server needs. `.env` is deliberately NOT synced -- it holds the real
      # secrets and is managed on the box by hand.
      - name: Sync compose and nginx config
        run: |
          ssh target "mkdir -p ${{ env.DEPLOY_DIR }}/infra"
          scp docker-compose.yml target:${{ env.DEPLOY_DIR }}/docker-compose.yml
          scp infra/nginx.conf target:${{ env.DEPLOY_DIR }}/infra/nginx.conf

      # --- release --------------------------------------------------------
      # Retagging to :current is what actually promotes the build -- compose
      # references the stable tag, so the SHA-tagged images stay on disk as
      # rollback targets (see "Rolling back" in README.md).
      - name: Release
        run: |
          ssh target bash -euo pipefail <<EOF
            cd ${{ env.DEPLOY_DIR }}
            docker tag pishnam-web:${{ steps.tags.outputs.web }} pishnam-web:current
            docker tag pishnam-migrator:${{ steps.tags.outputs.migrator }} pishnam-migrator:current

            # Migrations run to completion before web is recreated: compose
            # gates web on the migrator exiting 0, so a failed migration
            # leaves the previous version serving instead of pointing new
            # code at an old schema.
            docker compose up -d --remove-orphans

            docker image prune -f
          EOF

      - name: Verify deployment
        run: |
          ssh target bash -euo pipefail <<'EOF'
            cd /opt/pishnam
            echo "--- migrator output ---"
            docker compose logs --no-color --tail=30 migrator || true

            # Compose only re-runs the migrator when its image changed, and the
            # image tag is a hash of prisma/ + the lockfile -- so "unchanged
            # image" does mean "no new migrations". Assert it directly anyway,
            # to cover the cases that reasoning does not: a wiped volume, or a
            # migration that failed on an earlier deploy.
            echo "--- migration status ---"
            docker compose run --rm --no-deps migrator npx prisma migrate status

            # Checked through the published port rather than against the web
            # container directly, so this exercises the real path: host ->
            # nginx container -> web.
            echo "--- waiting for the stack to answer on :8081 ---"
            for attempt in $(seq 1 30); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                http://127.0.0.1:8081/robots.txt 2>/dev/null || echo 000)
              if [ "$code" = "200" ]; then
                echo "stack is serving (robots.txt 200 after ${attempt} attempt(s))"
                exit 0
              fi
              sleep 4
            done

            echo "Stack never answered 200 on /robots.txt (last code: ${code})."
            docker compose ps
            echo "--- web logs ---"
            docker compose logs --no-color --tail=60 web
            echo "--- nginx logs ---"
            docker compose logs --no-color --tail=20 nginx
            exit 1
          EOF

      - name: Confirm public entry point
        run: |
          echo "--- direct container port ---"
          curl -sS -o /dev/null -w '  :8081/robots.txt -> %{http_code}\n' \
            --max-time 25 "http://${{ secrets.SSH_HOST }}:8081/robots.txt"
          echo "--- through host nginx (the real entry point) ---"
          curl -sS -o /dev/null -w '  :80/robots.txt   -> %{http_code}\n' \
            --max-time 25 "http://${{ secrets.SSH_HOST }}/robots.txt"
