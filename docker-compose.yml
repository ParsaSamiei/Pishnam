name: pishnam

# Pishnam production stack.
#
# This box is shared with two other apps (pishtalk on :8080, iranopen-insitu on
# 127.0.0.1:4000) behind a single host nginx that owns :80 and :443. Two
# consequences shape this file:
#
#   1. Nothing here may bind :80 -- host nginx has it. Our nginx takes :8081
#      and host nginx proxies to it. See infra/nginx-host.conf.
#   2. Images are NOT pulled from ghcr.io. Only ~1 in 5 TLS connections to
#      ghcr.io from this server complete, so `docker compose pull` is not a
#      viable deploy step. The CI workflow builds on GitHub and streams the
#      image in over SSH (`docker save | ssh docker load`), which is why the
#      tags below are local names with no registry prefix.
#      See .github/workflows/deploy.yml.
#
# There is deliberately no umami/umami_db here: the pishtalk stack already runs
# a self-hosted Umami (127.0.0.1:3001, built with BASE_PATH=/analytics) and one
# Umami instance hosts many websites. On a 3.8 GB box a second analytics stack
# plus its own Postgres is ~600 MB of RAM to duplicate something already
# running. Host nginx proxies /analytics/ to the existing instance.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pishnam
      # No default on purpose -- compose refuses to start rather than silently
      # bringing up a production database with a guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pishnam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:` mapping. The only things that need this database are on the
    # pishnam network, and 127.0.0.1:5432 on the host is already taken by
    # pishtalk-db-1. Reach it for debugging with `docker compose exec postgres
    # psql -U pishnam` instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pishnam"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pishnam]

  # One-off job: applies pending migrations, then bootstraps the first admin.
  # Both are idempotent, so this runs on every deploy. `web` waits for it to
  # exit 0, which means a failed migration blocks the new code from serving
  # rather than letting it run against an out-of-date schema.
  migrator:
    image: pishnam-migrator:current
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: migrator
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pishnam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pishnam?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pishnam]

  web:
    image: pishnam-web:current
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pishnam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pishnam?schema=public
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [pishnam]
    healthcheck:
      # 127.0.0.1, NOT localhost. The image's /etc/hosts maps localhost to
      # both 127.0.0.1 and ::1; busybox wget tries ::1 first, and the Next
      # standalone server binds IPv4 only (HOSTNAME=0.0.0.0, per
      # node_modules/next/dist/docs/01-app/03-api-reference/05-config/
      # 01-next-config-js/output.md). So `localhost` is refused and the
      # container sits "unhealthy" while serving traffic perfectly well --
      # which is exactly what happened on the first deploy.
      #
      # /robots.txt, not / -- it is a route handler (src/app/robots.ts) that
      # answers 200 without touching the database, whereas `/` needs both
      # next-intl locale routing and a DB query. This is a liveness probe: it
      # should go red when the process is down, not when Postgres hiccups.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Published on all interfaces, matching how pishtalk exposes :8080. That
      # makes the app reachable two ways: host nginx proxies :80 here (the
      # normal path, plain http://<ip>/), and http://<ip>:8081 hits this
      # directly -- useful for checking whether a problem is ours or the host
      # proxy's.
      - "8081:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/uploads:ro
    depends_on:
      - web
    networks: [pishnam]

networks:
  pishnam:

volumes:
  postgres_data:
  # Persistent, named volume for uploaded media -- MUST stay a named volume
  # (not a bind mount into the container's writable layer) or uploads are
  # lost on every rebuild. Back this up on the same schedule as postgres_data.
  uploads:
