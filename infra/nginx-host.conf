# Pishnam -- HOST nginx vhost (not the container one; see infra/nginx.conf)
#
# Install on the server as:
#   /etc/nginx/sites-available/pishnam
#   /etc/nginx/sites-enabled/pishnam  -> symlink to the above
#
# Kept in the repo because the host nginx config is otherwise undocumented
# infrastructure -- the other two apps on this box have their proxy rules only
# on disk, which is how you end up unable to reproduce a server.
#
# --- Why default_server is safe here ---------------------------------------
# The existing vhosts are both name-based and NEITHER declares default_server:
#   sites-available/default   -> server_name pishtalk.com www.pishtalk.com
#                                            pishtalk.ir  www.pishtalk.ir
#   sites-available/insitu.ir -> server_name insitu.ir www.insitu.ir
# So there is no default_server to collide with (a second one would fail
# `nginx -t` with "a duplicate default server"), and nginx always prefers an
# exact server_name match over the default. Those two domains keep working
# untouched; this block only picks up requests that match nothing else --
# which is exactly what a bare http://194.180.11.200/ is.
#
# Before this existed, the bare IP fell through to the first-loaded :80 block
# (pishtalk's) and 301'd to https://pishtalk.com.
#
# --- pishnam.com -----------------------------------------------------------
# The pishtalk :443 block is the only HTTPS server on this box, which makes it
# the implicit default for unmatched SNI. Without an explicit vhost, any
# browser that upgrades http://pishnam.com to HTTPS (or a user typing
# https://pishnam.com) was served pishtalk's certificate and pishtalk's app.
# The named :80 block below gives the real domain an exact match; certbot then
# adds its own :443 block using the pishnam.com certificate. The catch-all
# default_server further down is kept so the bare IP still reaches Pishnam.

# Real domain: nginx matches this by name before any default_server.
server {
    server_name pishnam.com www.pishnam.com;

    # Matches the container nginx and sits above UPLOAD_MAX_BYTES (10 MiB) to
    # leave room for multipart overhead. The default 1m would reject uploads
    # here before they ever reached the app.
    client_max_body_size 12m;

    # Self-hosted Umami, reused from the pishtalk stack (that instance is built
    # with BASE_PATH=/analytics, so the prefix is preserved -- no trailing
    # slash on proxy_pass). Mirrors the pishtalk vhost's own /analytics block.
    location /analytics {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        # Pishnam's own nginx container (docker-compose.yml, nginx service).
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The container nginx reads this back via real_ip_header to restore the
        # true client IP for its rate-limit zones -- see infra/nginx.conf.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pishnam.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pishnam.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Catch-all for anything that matches no other server_name, including the bare
# server IP. Kept so http://194.180.11.200/ still reaches Pishnam.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Matches the container nginx and sits above UPLOAD_MAX_BYTES (10 MiB) to
    # leave room for multipart overhead. The default 1m would reject uploads
    # here before they ever reached the app.
    client_max_body_size 12m;

    # Self-hosted Umami, reused from the pishtalk stack (that instance is built
    # with BASE_PATH=/analytics, so the prefix is preserved -- no trailing
    # slash on proxy_pass). Mirrors the pishtalk vhost's own /analytics block.
    location /analytics {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        # Pishnam's own nginx container (docker-compose.yml, nginx service).
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The container nginx reads this back via real_ip_header to restore the
        # true client IP for its rate-limit zones -- see infra/nginx.conf.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    if ($host = www.pishnam.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = pishnam.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name pishnam.com www.pishnam.com;
    return 404; # managed by Certbot
}
