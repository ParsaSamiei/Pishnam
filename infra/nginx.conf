# Pishnam -- nginx reverse proxy
# Serves /uploads/* directly from the shared volume (faster than proxying
# through Next.js for static files) and proxies everything else to the web
# service. TLS is expected to be handled by certbot/an external LB in front
# of this -- adjust the `listen`/`ssl_*` directives to match your setup.

upstream pishnam_web {
  server web:3000;
}

# Rate limit zone for upload endpoints, per the upload-security checklist in
# docs/05-frontend-architecture.md ("Rate-limit upload endpoints").
limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/m;
# General lead-form / API rate limiting -- app-level limiting in
# lib/rate-limit.ts is the primary defense; this is a coarse second layer.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
  listen 80;
  server_name pishnam.example _;

  client_max_body_size 12m; # slightly above UPLOAD_MAX_BYTES to allow for multipart overhead

  # Uploaded media -- served directly from the named volume, never executed.
  location /uploads/ {
    alias /app/uploads/;
    autoindex off;

    # Belt-and-suspenders alongside the app-level checks: these are never
    # meant to be executable, so refuse to serve anything that looks like it.
    location ~* \.(php|php[3-8]?|phtml|pl|py|jsp|asp|aspx|sh|cgi)$ {
      deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "inline" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/admin/upload {
    limit_req zone=uploads burst=3 nodelay;
    proxy_pass http://pishnam_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://pishnam_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://pishnam_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Self-hosted Umami, reverse-proxied under /analytics -- see
  # docs/09-analytics-i18n.md.
  location /analytics/ {
    proxy_pass http://umami:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
