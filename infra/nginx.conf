# Pishnam -- nginx reverse proxy (container)
#
# Serves /uploads/* directly from the shared volume (faster than proxying
# through Next.js for static files) and proxies everything else to the web
# service.
#
# This sits BEHIND the host nginx, which owns :80/:443 and terminates TLS --
# see infra/nginx-host.conf. Two layers is deliberate: the host config is not
# in version control, so everything app-specific (upload serving, rate limit
# zones, security headers) lives here where it ships with the code.
#
# /analytics is NOT handled here. It is proxied by the host nginx to the Umami
# instance the pishtalk stack already runs on 127.0.0.1:3001, which is outside
# this compose project's network.

upstream pishnam_web {
  server web:3000;
}

# Recover the real client IP from the host nginx's X-Forwarded-For.
#
# Without this every request arrives from the Docker bridge gateway, so the
# limit_req zones below would key on a single address and throttle all
# visitors collectively -- one busy client would rate-limit everyone.
#
# Only private ranges are trusted, so a spoofed X-Forwarded-For from a real
# client hitting :8081 directly (that port is published) is ignored.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limit zone for upload endpoints, per the upload-security checklist in
# docs/05-frontend-architecture.md ("Rate-limit upload endpoints").
limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/m;
# General lead-form / API rate limiting -- app-level limiting in
# lib/rate-limit.ts is the primary defense; this is a coarse second layer.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
  listen 80;
  # Catch-all: this server is reached by IP (no domain yet) and via the host
  # proxy, so matching on a specific name would just make it fragile.
  server_name _;

  client_max_body_size 12m; # slightly above UPLOAD_MAX_BYTES to allow for multipart overhead

  # Uploaded media -- served directly from the named volume, never executed.
  location /uploads/ {
    alias /app/uploads/;
    autoindex off;

    # Belt-and-suspenders alongside the app-level checks: these are never
    # meant to be executable, so refuse to serve anything that looks like it.
    location ~* \.(php|php[3-8]?|phtml|pl|py|jsp|asp|aspx|sh|cgi)$ {
      deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "inline" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/admin/upload {
    limit_req zone=uploads burst=3 nodelay;
    proxy_pass http://pishnam_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://pishnam_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://pishnam_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
